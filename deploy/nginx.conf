# SPA config for nginx: serve dist/frontend-an22/browser and fall back to index.html
# (the production server is the an22-web repo — Node.js; this file is a reference)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed bundles (main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css) can be cached forever
  location ~* -[A-Za-z0-9_-]{8}\.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Other files (favicon.ico, ...) are not hashed: revalidate every time; a missing file is 404, not index.html
  location ~* \.[a-z0-9]+$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Proxy API to the real backend (when environment.useMock = false) — keeps the /api prefix, like proxy.conf.json
  # (no trailing slash after the target, else nginx strips /api)
  # location /api/ { proxy_pass http://backend:8080; }

  # Every other route -> index.html (Angular Router handles it)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
