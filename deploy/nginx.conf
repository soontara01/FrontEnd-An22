# SPA config for nginx: serve dist/frontend-an22/browser and fall back to index.html
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed bundles can be cached forever
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy API to the real backend (when environment.useMock = false)
  # location /api/ { proxy_pass http://backend:8080/; }

  # Every other route -> index.html (Angular Router handles it)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
