<h2 mat-dialog-title>เปิดกะ</h2>
<mat-dialog-content>
  <p class="text-muted small">
    นับเงินทอนในลิ้นชักก่อนเริ่มขาย — คุณจะเป็นผู้รับผิดชอบเงินในลิ้นชักจนกว่าจะปิดกะ
  </p>

  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>เครื่อง POS</mat-label>
      <input
        matInput
        type="number"
        min="1"
        step="1"
        [value]="terminalId()"
        (input)="terminalId.set($any($event.target).value)"
      />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>เงินทอนตั้งต้น</mat-label>
      <input
        matInput
        appAutofocus
        type="number"
        min="0"
        step="0.25"
        [disabled]="counting() && countTotal() > 0"
        [value]="openingFloat()"
        (input)="float.set($any($event.target).value)"
        (keydown.enter)="save()"
      />
      <span matTextSuffix>บาท</span>
    </mat-form-field>
  </div>

  <mat-slide-toggle [checked]="counting()" (change)="counting.set($event.checked)">
    นับตามชนิดแบงก์ / เหรียญ
  </mat-slide-toggle>
  @if (counting()) {
    <app-denomination-counter [(counts)]="counted" />
  }

  @if (problem(); as message) {
    <div class="problem">{{ message }}</div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>ยกเลิก</button>
  <button mat-flat-button type="button" [disabled]="!!problem()" (click)="save()">
    <mat-icon>lock_open</mat-icon>
    เปิดกะ
  </button>
</mat-dialog-actions>
